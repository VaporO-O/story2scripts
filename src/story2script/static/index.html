<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Story2Script · 小说剧本对照工作台</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">Story<span>2</span>Script</a>
      <nav>
        <a href="/docs">API 文档</a>
        <a href="/api/screenplay/schema">Schema</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <p class="eyebrow">NOVEL TO SCREENPLAY</p>
        <h1>AI 小说转剧本工作台</h1>
        <p>左侧输入小说，右侧对照查看 YAML 剧本，并自动整理人物小传。</p>
      </section>

      <section class="workspace">
        <section class="panel">
          <div class="panel-heading">
            <div>
              <span>01</span>
              <h2>小说原文</h2>
            </div>
            <div class="button-row">
              <div class="view-toggle" role="group" aria-label="小说视图切换">
                <button id="novelEditViewButton" class="view-button is-active" type="button">编辑</button>
                <button id="novelChapterViewButton" class="view-button" type="button">按章节</button>
              </div>
              <button id="importNovelFileButton" class="ghost-button">导入文件</button>
              <button id="loadExampleButton" class="ghost-button">填入示例</button>
            </div>
            <input
              id="novelFileInput"
              class="hidden"
              type="file"
              accept=".txt,.text,.md,.markdown,.csv,.log,.epub,.mobi,.azw,.azw3,text/*"
            />
          </div>

          <div class="metadata">
            <label>作品名<input id="titleInput" placeholder="例如：雾港来信" /></label>
            <label>类型<input id="genreInput" placeholder="例如：悬疑 / 剧情" /></label>
            <label>
              改编类型
              <select id="adaptationTypeInput">
                <option value="短剧">短剧</option>
                <option value="影视剧" selected>影视剧</option>
                <option value="舞台剧">舞台剧</option>
                <option value="广播剧">广播剧</option>
                <option value="分镜脚本">分镜脚本</option>
              </select>
            </label>
          </div>

          <textarea id="novelInput" placeholder="请粘贴小说正文，并使用“第一章 标题”格式标记至少三个章节……"></textarea>
          <div id="chapterView" class="chapter-view hidden"></div>

          <div class="panel-footer">
            <span id="chapterCount">已识别 0 个章节</span>
            <div class="convert-controls">
              <label class="mode-select">
                转换模式
                <select id="convertModeInput">
                  <option value="demo" selected>本地</option>
                  <option value="ai">AI</option>
                </select>
              </label>
              <div class="button-row">
                <button id="analyzeCharactersButton" class="ghost-button">分析人物</button>
                <button id="convertButton" class="primary-button">生成剧本</button>
              </div>
            </div>
          </div>
        </section>

        <section class="panel script-panel">
          <div class="panel-heading">
            <div>
              <span>02</span>
              <h2>剧本</h2>
            </div>
            <div class="button-row">
              <div class="view-toggle" role="group" aria-label="视图切换">
                <button id="previewViewButton" class="view-button is-active" type="button">预览</button>
                <button id="sourceViewButton" class="view-button" type="button">源码</button>
              </div>
              <button id="validateButton" class="ghost-button">校验</button>
              <button id="downloadButton" class="ghost-button">下载</button>
            </div>
          </div>

          <div class="rewrite-tools">
            <div class="rewrite-fields">
              <label>场景 ID<input id="sceneIdInput" value="scene-1" /></label>
              <label>
                重写模式
                <select id="rewriteModeInput">
                  <option value="demo" selected>本地</option>
                  <option value="ai">AI</option>
                </select>
              </label>
              <label>
                角色
                <select id="rewriteCharacterInput">
                  <option value="">（自动选择）</option>
                </select>
              </label>
              <label>语气<input id="rewriteToneInput" value="更克制" /></label>
            </div>
            <div class="rewrite-actions">
              <button class="ghost-button" data-rewrite-operation="rewrite_dialogue">
                重新生成本场对白
              </button>
              <button class="ghost-button" data-rewrite-operation="strengthen_conflict">
                加强戏剧冲突
              </button>
              <button class="ghost-button" data-rewrite-operation="short_drama_pace">
                改成短剧节奏
              </button>
              <button class="ghost-button" data-rewrite-operation="add_camera_hints">
                增加镜头提示
              </button>
              <button class="ghost-button" data-rewrite-operation="reduce_narration">
                减少旁白
              </button>
              <button class="ghost-button" data-rewrite-operation="adjust_character_voice">
                调整人物语气
              </button>
            </div>
          </div>

          <div id="conversionProgress" class="conversion-progress hidden" aria-live="polite">
            <div class="progress-meta">
              <span id="conversionProgressStage">等待转换</span>
              <span id="conversionProgressPercent">0%</span>
            </div>
            <div class="progress-track">
              <div id="conversionProgressBar" class="progress-bar"></div>
            </div>
            <p id="conversionProgressMessage">转换任务尚未开始。</p>
          </div>

          <div id="emptyState" class="empty-state">
            <div class="script-card">SCENE<br /><strong>01</strong></div>
            <h3>等待故事开场</h3>
            <p>生成后的剧本会以分场预览显示，可切换到“源码”直接编辑 YAML 再校验。</p>
          </div>

          <div id="scriptPreview" class="script-preview hidden"></div>
          <textarea id="yamlOutput" class="hidden" spellcheck="false"></textarea>
          <div id="message" class="message">准备就绪</div>
        </section>
      </section>

      <section class="profile-panel">
        <div class="section-heading">
          <div>
            <span>03</span>
            <h2>人物小传</h2>
          </div>
          <p>从小说中自动提取角色定位、性格、目标、关系、出场章节和关键变化。</p>
        </div>
        <div id="profileEmptyState" class="profile-empty">点击“分析人物”后，将在这里生成人物小传表。</div>
        <div id="profileGrid" class="profile-grid"></div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
