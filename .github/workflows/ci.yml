name: CI

on:
  push:
  pull_request:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build single-instance image
        run: docker build --tag story2script:ci .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,redis]"
      - run: ruff check . --output-format=github
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/speech_queue.test.cjs
      - run: node --test tests/chapter_parser.test.cjs
      - run: node --check src/story2script/static/studio.js

  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,redis]"
      - run: pytest tests/test_redis_integration.py -q
        env:
          STORY2SCRIPT_TEST_REDIS_URL: redis://127.0.0.1:6379/0
          STORY2SCRIPT_DISABLE_DOTENV: "1"

  deterministic-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run offline regression evaluation
        run: >-
          story2script-eval run
          --dataset evals/datasets/v1/dev.json
          --dataset evals/datasets/v1/holdout.json
          --baseline evals/baselines/demo-v1.json
          --output-dir evals/reports
          --report-prefix demo-v1
          --fail-on-regression
      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story2script-demo-eval
          path: evals/reports/demo-v1.*
          if-no-files-found: error

      - name: Run retrieval regression evaluation
        run: >-
          story2script-eval rag
          --dataset evals/datasets/rag/v1/dev.json
          --dataset evals/datasets/rag/v1/holdout.json
          --min-recall 0.95
          --min-mrr 0.8
          --output evals/reports/rag-v1
      - name: Upload retrieval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story2script-rag-eval
          path: evals/reports/rag-v1.*
          if-no-files-found: error

  review-agent-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run historical code review evaluation
        run: >-
          story2script-review eval
          --dataset evals/reviewagent/v1/cases.json
          --repo .
          --output-dir evals/reports
          --report-prefix reviewagent-v1
          --min-recall 1.0
          --max-false-positive-rate 0.0
      - name: Upload review evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story2script-review-eval
          path: evals/reports/reviewagent-v1.*
          if-no-files-found: error
