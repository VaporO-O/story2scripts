[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "story2script"
version = "0.1.0"
description = "AI-assisted novel-to-screenplay workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.0,<5.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "mcp>=1.9,<2.0",
  "pydantic>=2.9,<3.0",
  "PyYAML>=6.0,<7.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
story2script-mcp = "story2script.mcp_server:main"
story2script-eval = "story2script.evaluation.__main__:main"
story2script-review = "reviewagent.__main__:main"

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2.0",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]
review = [
  "bandit>=1.8,<2.0",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep local and CI lint behavior stable across Ruff versions and environments.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]
